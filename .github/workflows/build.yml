name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallReminder
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CallReminder.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CallReminder.apk \
            --title "Call Reminder (build ${{ github.run_number }})" \
            --notes "Open this page on your phone, tap CallReminder.apk to download it, then open the file to install."
